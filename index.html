<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slack UI Shell</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="slack-shell" aria-label="Slack workspace">
      <aside class="workspace-rail" aria-label="Workspaces">
        <button class="workspace-icon active" aria-label="Acme workspace">A</button>
        <button class="workspace-icon" aria-label="Design workspace">D</button>
        <button class="workspace-icon add" aria-label="Add workspace">+</button>
      </aside>

      <nav class="channel-sidebar" aria-label="Channels">
        <header class="sidebar-header">
          <div>
            <p class="eyebrow">Workspace</p>
            <h1>Acme Co</h1>
          </div>
          <button class="compose-button" aria-label="Compose message">✎</button>
        </header>

        <section class="sidebar-section quick-links" aria-label="Quick links">
          <button class="sidebar-row unread">
            <span class="row-icon">💬</span>
            Threads
            <span class="badge mention" aria-label="2 unread mentions">2</span>
          </button>
          <button class="sidebar-row">
            <span class="row-icon">🔔</span>
            Activity
          </button>
          <button class="sidebar-row unread">
            <span class="row-icon">📨</span>
            DMs
            <span class="badge" aria-label="5 unread messages">5</span>
          </button>
        </section>

        <section class="sidebar-section" aria-labelledby="channels-title">
          <div class="section-heading">
            <button aria-expanded="true">▾</button>
            <h2 id="channels-title">Channels</h2>
          </div>
          <div id="channel-list" class="channel-list"></div>
        </section>
      </nav>

      <section class="conversation" aria-live="polite">
        <header class="conversation-header">
          <div>
            <p class="eyebrow">Channel</p>
            <h2 id="active-channel-name"># general</h2>
            <p id="active-channel-topic" class="topic">Company-wide announcements and work-based matters</p>
          </div>
          <div id="active-channel-meta" class="conversation-meta">128 members</div>
        </header>

        <div id="message-list" class="message-list"></div>
      </section>
    </main>

    <script src="src/sidebar-state.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
